<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HandSpeak Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #E4F0F2;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .chat-header {
            background: #1E5FA3;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        .message {
            max-width: 75%;
            padding: 10px;
            border-radius: 10px;
            margin: 5px 0;
        }
        .sent {
            background: #5C9EC6;
            color: white;
            align-self: flex-end;
            text-align: right;
        }
        .received {
            background: #fff;
            color: #333;
            align-self: flex-start;
            text-align: left;
        }
        .input-container {
            display: flex;
            padding: 10px;
            background: white;
            border-top: 1px solid #ddd;
        }
        input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background: #5C9EC6;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
            margin-left: 5px;
        }
        button:hover {
            background: #417A9B;
        }
    </style>
</head>
<body>

    <!-- Chat Header -->
    <div class="chat-header">
        <button onclick="goBack()">🔙</button>
        <h2>Chat with Alex</h2>
        <span>🟢 Online</span>
    </div>

    <!-- Chat Messages -->
    <div class="chat-container" id="chatBox">
        <div class="message received">Hello! How are you? 😊</div>
        <div class="message sent">I'm good, thanks! What about you? 🤟</div>
    </div>

    <!-- Chat Input -->
    <div class="input-container">
        <input type="text" id="messageInput" placeholder="Type a message...">
        <button onclick="sendMessage()">📩</button>
    </div>

    <script>
        function sendMessage() {
            let input = document.getElementById("messageInput");
            let chatBox = document.getElementById("chatBox");
            
            if (input.value.trim() !== "") {
                let newMessage = document.createElement("div");
                newMessage.classList.add("message", "sent");
                newMessage.innerText = input.value;
                chatBox.appendChild(newMessage);
                
                input.value = "";
                chatBox.scrollTop = chatBox.scrollHeight;  // Auto-scroll to new message
            }
        }

        function goBack() {
            window.history.back();
        }
    </script>

</body>
</html>
