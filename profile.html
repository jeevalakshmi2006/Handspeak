<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | HandSpeak</title>
    <style>
        /* Global Styles */
        :root {
            --primary-color: #1e5fa3;
            --secondary-color: #5c9ec6;
            --bg-light: #e4f0f2;
            --bg-dark: #1c1c1c;
            --text-light: #333;
            --text-dark: #f1f1f1;
            --cherry-red: #d32f2f;
            --cherry-hover: #b71c1c;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-light);
            color: var(--text-light);
            transition: all 0.3s ease;
        }

        /* Dark Mode */
        body.dark-mode {
            background-color: var(--bg-dark);
            color: var(--text-dark);
        }

        /* Header */
        header {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dark-mode-toggle {
            background: none;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 18px;
            margin-right: 15px;
        }

        /* Container */
        .container {
            width: 90%;
            max-width: 800px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
        }

        body.dark-mode .container {
            background: #2a2a2a;
            box-shadow: 0 4px 10px rgba(255, 255, 255, 0.1);
        }

        h2 {
            color: var(--primary-color);
            text-align: center;
        }

        body.dark-mode h2 {
            color: var(--secondary-color);
        }

        /* Profile Section */
        .profile-picture {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .profile-picture img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid var(--secondary-color);
        }

        .profile-picture button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 12px;
            margin-top: 10px;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }

        .profile-picture button:hover {
            background-color: var(--secondary-color);
        }

        /* Profile Information */
        .profile-section label {
            display: block;
            font-weight: bold;
            margin-top: 10px;
        }

        .profile-section input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--secondary-color);
            border-radius: 5px;
            margin-top: 5px;
            transition: 0.3s;
            font-size: 16px;
        }

        .profile-section input:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        /* Button Container */
        .button-container {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            margin: 0 5px;
            padding: 12px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
            text-align: center;
            transition: 0.3s;
        }

        .save-btn {
            background-color: var(--primary-color);
            color: white;
        }

        .save-btn:hover {
            background-color: var(--secondary-color);
        }

        .danger-btn {
            background-color: var(--cherry-red);
            color: white;
        }

        .danger-btn:hover {
            background-color: var(--cherry-hover);
        }

        /* Footer */
        footer {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .container {
                width: 95%;
                padding: 15px;
            }

            header {
                font-size: 20px;
                padding: 10px;
            }

            .button-container {
                flex-direction: column;
            }

            .btn {
                margin: 5px 0;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        Profile | HandSpeak
        <button class="dark-mode-toggle" onclick="toggleDarkMode()">🌙</button>
    </header>

    <!-- Main Content -->
    <div class="container">
        <!-- Profile Picture -->
        <div class="profile-picture">
            <img src="https://via.placeholder.com/120" alt="Profile Picture">
            <button>Change Photo</button>
        </div>

        <!-- Profile Information -->
        <div class="profile-section">
            <label>Full Name</label>
            <input type="text" id="fullName" placeholder="Enter your full name">

            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email">

            <label>Phone Number</label>
            <input type="text" id="phone" placeholder="Enter your phone number">
        </div>

        <!-- Buttons in One Row -->
        <div class="button-container">
            <button class="btn save-btn" onclick="saveChanges()">Save Changes</button>
            <button class="btn danger-btn" onclick="redirectToIndex()">Log Out</button>
            <button class="btn danger-btn" onclick="redirectToIndex()">Delete Account</button>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        &copy; 2025 HandSpeak. All Rights Reserved.
    </footer>

    <!-- JavaScript -->
    <script>
        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
        }

        function saveChanges() {
            const fullName = document.getElementById("fullName").value;
            const email = document.getElementById("email").value;
            const phone = document.getElementById("phone").value;

            if (fullName && email && phone) {
                alert("Changes saved successfully!");
            } else {
                alert("Please fill in all fields before saving.");
            }
        }

        function redirectToIndex() {
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
