<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chats - HandSpeak</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #E4F0F2;
            color: #333;
        }
        .header {
            background: #1E5FA3;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        .chat-list {
            max-width: 400px;
            margin: 20px auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .chat-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #ddd;
            cursor: pointer;
        }
        .chat-item:hover {
            background: #f0f0f0;
        }
        .chat-item img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 15px;
        }
        .chat-details {
            flex: 1;
        }
        .chat-name {
            font-size: 16px;
            font-weight: bold;
        }
        .chat-last-msg {
            font-size: 14px;
            color: gray;
        }
    </style>
</head>
<body>

    <div class="header">Chats</div>

    <div class="chat-list">
        <div class="chat-item" onclick="openChat('Alex')">
            <img src="https://via.placeholder.com/50" alt="Alex">
            <div class="chat-details">
                <div class="chat-name">Alex</div>
                <div class="chat-last-msg">Hey, how's it going?</div>
            </div>
        </div>
        <div class="chat-item" onclick="openChat('Sophia')">
            <img src="https://via.placeholder.com/50" alt="Sophia">
            <div class="chat-details">
                <div class="chat-name">Sophia</div>
                <div class="chat-last-msg">Let's meet up later!</div>
            </div>
        </div>
    </div>

    <script>
        function openChat(userName) {
            window.location.href = "chat.html?user=" + userName;
        }
    </script>

</body>
</html>
