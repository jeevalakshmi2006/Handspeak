<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream - AI Sign Translator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .header {
            background: #4444bc;
            color: white;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header button {
            background: transparent;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }
        .main-container {
            padding: 20px;
        }
        .video-container {
            position: relative;
            width: 50%;
            margin: auto;
            background: black;
            border-radius: 10px;
            overflow: hidden;
        }
        video {
            width: 80%;
            border-radius: 10px;
        }
        .subtitle-box {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        .controls {
            margin-top: 20px;
        }
        .controls button {
            background: #4444bc ;
            color: white;
            padding: 10px 20px;
            margin: 5px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #333;
            padding: 10px 0;
            color: white;
            display: flex;
            justify-content: center;
        }
        .bottom-nav button {
            background: transparent;
            border: none;
            color: white;
            font-size: 16px;
            margin: 0 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <button onclick="goBack()">🔙</button>
        <h2>Live Stream</h2>
        <button onclick="openSettings()">⚙️</button>
    </div>

    <div class="main-container">
        <div class="video-container">
            <video id="liveVideo" autoplay></video>
            <div id="subtitleBox" class="subtitle-box">Translating...</div>
        </div>

        <div class="controls">
            <button onclick="toggleSubtitles()"> Subtitle Mode</button>
            <button onclick="toggleSpeech()"> Text-to-Speech</button>
<button onclick="endStream()"> End Stream</button>
            <button onclick="startRecording()"> Save Stream</button>
            
        </div>
    </div>

    <div class="bottom-nav">
        <button onclick="endStream()"> End Stream</button>
        <button onclick="openHistory()"> History</button>
        <button onclick="openSettings()"> Settings</button>
    </div>

    <script>
        let mediaRecorder;
        let recordedChunks = [];
        let subtitleVisible = false;
        let ttsEnabled = false;
        let recognitionInterval;
        
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                document.getElementById('liveVideo').srcObject = stream;

                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = event => recordedChunks.push(event.data);
            } catch (error) {
                alert("Error accessing the camera: " + error);
            }
        }

        function toggleSubtitles() {
            subtitleVisible = !subtitleVisible;
            document.getElementById("subtitleBox").style.display = subtitleVisible ? "block" : "none";
        }

        function toggleSpeech() {
            ttsEnabled = !ttsEnabled;
            alert(ttsEnabled ? "Text-to-Speech Enabled" : "Text-to-Speech Disabled");
        }

        function startRecording() {
            recordedChunks = [];
            mediaRecorder.start();
            alert("Recording started...");
        }

        function stopRecording() {
            mediaRecorder.stop();
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'live_stream.mp4';
                a.click();
            };
        }

        function inviteInterpreter() {
            prompt("Enter interpreter's email to send an invite:");
        }

        function goBack() {
            alert("Going back to the previous page...");
        }

        function endStream() {
            if (confirm("Are you sure you want to end the stream?")) {
                alert("Stream Ended.");
            }
        }

        function openHistory() {
            alert("Opening History...");
        }

        function openSettings() {
            alert("Opening Settings...");
        }

        // Mock AI Sign Language Recognition - Replace with real AI integration
        function startAIRecognition() {
            const signs = ["Hello", "Thank You", "Yes", "No", "Good Morning"];
            let index = 0;

            recognitionInterval = setInterval(() => {
                if (subtitleVisible) {
                    document.getElementById("subtitleBox").innerText = signs[index];
                }
                if (ttsEnabled) {
                    speakText(signs[index]);
                }
                index = (index + 1) % signs.length;
            }, 3000);
        }

        function speakText(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            speechSynthesis.speak(utterance);
        }

        window.onload = function () {
            startCamera();
            startAIRecognition();
        };
    </script>

</body>
</html>
