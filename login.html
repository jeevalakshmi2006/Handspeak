<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HandSpeak Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #2424b3, #7677e6);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }

        h1 {
            color: #2424b4;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #4546bc;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #3453dc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #4479f3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px; /* Add some space above the button */
        }

        button:hover {
            background-color: #3453dc;
        }

        .message {
            margin-top: 15px;
            color: #ff0000;
        }

        .create-account {
            margin-top: 15px;
            color: grey; /* Set the color of "Don't have an account?" to grey */
        }

        .create-account span {
            color: #4479f3; /* Set the color of "Create one" to blue */
            text-decoration: underline; /* Underline only the "Create one" part */
            cursor: pointer; /* Change cursor to pointer for the clickable part */
        }
 .logo {
            position: absolute; /* Position the logo */
            top: 10px;
            left: 10px;
            display: flex;
            align-items: center;
            color: white; /* Text color */
            font-weight: bold; /* Bold text */
            font-size:40px
        }
        .logo img {
            height: 30px; /* Adjust size of the logo */
            margin-right: 5px; /* Space between logo and text */
        }

    </style>
</head>
<body>
    <div class="logo">
        <img src="https://i.pinimg.com/474x/dd/1d/69/dd1d69a525baf751ff29f3ed994ccdaf.jpg" alt="Logo"> <!-- Replace with your logo source -->
        HandSpeak
    </div>

    <div class="container">
        <h1>HandSpeak</h1>
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <p class="message" id="message"></p>
        <p class="create-account">Don't have an account? <span id="createAccountLink">Create one</span></p>
    </div>
    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();
            // Redirect to dashboard.html on successful login
            window.location.href = 'dashboard.html';
        });

        document.getElementById("createAccountLink").addEventListener("click", function() {
            // Redirect to signup.html
            window.location.href = 'signup.html';
        });
    </script>
</body>
</html>
